<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0c0a1e"/>
    </linearGradient>
  </defs>

  <!-- App background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- Broadcast waves (representing Telegram channels feeding in) -->
  <circle cx="184" cy="272" r="24" fill="#6366f1"/>

  <path d="M 184,272 m -64,0 a 64,64 0 0,1 128,0"
        fill="none" stroke="#818cf8" stroke-width="20" stroke-linecap="round"/>
  <path d="M 184,272 m -108,0 a 108,108 0 0,1 216,0"
        fill="none" stroke="#818cf8" stroke-width="16" stroke-linecap="round" opacity="0.55"/>
  <path d="M 184,272 m -152,0 a 152,152 0 0,1 304,0"
        fill="none" stroke="#818cf8" stroke-width="12" stroke-linecap="round" opacity="0.25"/>

  <!-- News document -->
  <rect x="296" y="148" width="164" height="214" rx="16" fill="#1e1b4b" stroke="#4f46e5" stroke-width="4"/>

  <!-- Document header bar -->
  <rect x="296" y="148" width="164" height="40" rx="16" fill="#4f46e5"/>
  <rect x="296" y="168" width="164" height="20" fill="#4f46e5"/>

  <!-- Headline -->
  <rect x="318" y="208" width="120" height="14" rx="5" fill="#e0e7ff"/>

  <!-- Body lines -->
  <rect x="318" y="236" width="120" height="9" rx="3" fill="#818cf8" opacity="0.55"/>
  <rect x="318" y="254" width="102" height="9" rx="3" fill="#818cf8" opacity="0.45"/>
  <rect x="318" y="272" width="112" height="9" rx="3" fill="#818cf8" opacity="0.38"/>
  <rect x="318" y="290" width="88"  height="9" rx="3" fill="#818cf8" opacity="0.28"/>

  <!-- Score ring (top-right of document) -->
  <circle cx="432" cy="168" r="22" fill="#0c0a1e" stroke="#6366f1" stroke-width="4"/>
  <circle cx="432" cy="168" r="7"  fill="#a5b4fc"/>

  <!-- Channel dots at base (3 sources) -->
  <circle cx="318" cy="328" r="8" fill="#6366f1" opacity="0.8"/>
  <circle cx="340" cy="328" r="8" fill="#6366f1" opacity="0.55"/>
  <circle cx="362" cy="328" r="8" fill="#6366f1" opacity="0.35"/>
</svg>
