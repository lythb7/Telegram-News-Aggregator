services:
  app:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=file:/app/data/news.db
      - UPLOADS_DIR=/app/uploads
    volumes:
      - ./data:/app/data       # SQLite database (persistent)
      - ./uploads:/app/uploads # Downloaded media (persistent)
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/channels"]
      interval: 30s
      timeout: 5s
      retries: 3
